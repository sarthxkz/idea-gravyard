<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Idea Graveyard</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪦</text></svg>" />
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <nav class="navbar">
        <a href="/index.html" class="nav-brand"><span class="skull">🪦</span> Idea Graveyard</a>
        <ul class="nav-links">
            <li><a href="/index.html"><span>🏠</span> <span>Home</span></a></li>
            <li><a href="/submit.html"><span>➕</span> <span>Submit Idea</span></a></li>
            <li><a href="/categories.html"><span>🏷️</span> <span>Categories</span></a></li>
            <li><a href="/analytics.html"><span>📊</span> <span>Analytics</span></a></li>
        </ul>
        <div class="nav-auth" id="nav-auth"></div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">🪦</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to submit and discuss failed ideas</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="input-field" placeholder="you@example.com" required
                        autocomplete="email" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required
                        autocomplete="current-password" />
                </div>

                <p id="loginError" style="color:var(--danger);font-size:0.85rem;margin-bottom:0.75rem;display:none"></p>

                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">
                    Login
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account? <a href="/register.html">Register here</a>
            </p>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
</body>

</html>
